<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Vael Intro</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <!-- Добавляем viewport сразу для всех устройств, чтобы мобильная верстка не ломалась -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      if (msg.indexOf("instantiateStreaming") !== -1 || msg.indexOf("streaming compilation failed") !== -1) {
        return;
      }
      var warningBanner = document.querySelector("#unity-warning");
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      warningBanner.style.display = 'block';
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Vael_WebGL_Build.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Vael_WebGL_Build.data.unityweb",
      frameworkUrl: buildUrl + "/Vael_WebGL_Build.framework.js.unityweb",
      codeUrl: buildUrl + "/Vael_WebGL_Build.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Vael",
      productName: "Vael Intro",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    // ВЫРЕЗАЛИ ПРОВЕРКУ USER-AGENT. Теперь и мобилки, и ПК идут по одной быстрой логике
    canvas.style.width = "100%";
    canvas.style.height = "100%";

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
      }).catch((message) => {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
